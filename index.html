<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="USFans+">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Salty Finds</title>
  <meta name="description" content="Busca entre miles de productos y cómpralos con USFans sin salir de la página.">
  <meta name="theme-color" content="#f5f5f7" id="themeColor">
  <script>
    // Tema claro por defecto; el oscuro solo si el usuario lo eligió antes
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
    // Idioma: el elegido antes o, si no, el del navegador (español o inglés)
    (function () {
      var lang = null;
      try { lang = localStorage.getItem('lang'); } catch (e) {}
      if (lang !== 'es' && lang !== 'en') lang = /^es/i.test(navigator.language || '') ? 'es' : 'en';
      document.documentElement.lang = lang;
    })();
  </script>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=17">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>
  <script src="app.js?v=17" defer></script>
</head>
<body>
  <div class="app" id="app">
    <!-- Panel lateral de herramientas -->
    <aside class="drawer" id="drawer" aria-label="Herramientas">
      <header class="drawer-head">
        <div class="brand">
          <img class="logo-light" src="logo-light.png" alt="USFans+" width="1270" height="232">
          <img class="logo-dark" src="logo-dark.png" alt="" aria-hidden="true" width="1270" height="232">
        </div>
        <div class="head-actions">
        <div class="lang-switch" role="group" data-i18n-attr="aria-label:language">
          <button type="button" data-lang="es" lang="es">ES</button>
          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
        <button class="icon-btn" id="themeToggle" aria-pressed="false">
          <svg class="ico-moon" viewBox="0 0 24 24" width="17" height="17"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <svg class="ico-sun" viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="closeDrawer" data-i18n-attr="title:hidePanel;aria-label:hidePanel">
          <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        </div>
      </header>

      <nav class="tools" id="tools" role="tablist" hidden></nav>

      <section class="tool" id="tool-products" role="tabpanel">
        <div class="search-wrap">
          <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" data-i18n-attr="placeholder:search;aria-label:searchLabel" autocomplete="off" spellcheck="false">
        </div>
        <div class="filters" id="filters">
          <button class="chip-arrow prev" id="chipsPrev" data-i18n-attr="aria-label:prevCats" tabindex="-1">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="chips" id="chips" role="toolbar" data-i18n-attr="aria-label:categories"></div>
          <button class="chip-arrow next" id="chipsNext" data-i18n-attr="aria-label:nextCats" tabindex="-1">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="list-head">
          <p class="count" id="count" data-i18n="loading">Cargando productos…</p>
          <div class="sort-wrap">
            <select id="sort" data-i18n-attr="aria-label:sortLabel">
              <option value="default" data-i18n="sortDefault">Destacados</option>
              <option value="price-asc" data-i18n="sortPriceAsc">Precio ↑</option>
              <option value="price-desc" data-i18n="sortPriceDesc">Precio ↓</option>
              <option value="name" data-i18n="sortName">Nombre A–Z</option>
            </select>
          </div>
        </div>
        <div class="list" id="list">
          <div class="grid" id="grid"></div>
          <div class="sentinel" id="sentinel"></div>
        </div>
      </section>

      <section class="tool" id="tool-qc" role="tabpanel" hidden>
        <form class="qc-form" id="qcForm" autocomplete="off">
          <div class="search-wrap">
            <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="qcInput" type="url" inputmode="url" spellcheck="false" data-i18n-attr="placeholder:qcPlaceholder;aria-label:qcPlaceholder">
          </div>
          <button class="btn qc-submit" type="submit" data-i18n="qcSearch">Buscar QC</button>
        </form>
        <p class="qc-help" data-i18n="qcHelp">Pega un enlace de Taobao, Weidian, 1688 o de cualquier agente.</p>
        <div class="qc-result" id="qcResult" aria-live="polite"></div>
      </section>

      <section class="tool" id="tool-chat" role="tabpanel" hidden>
        <div class="chat-wrap" id="chatWrap"></div>
        <div class="tool-empty" id="chatEmpty" hidden>
          <svg viewBox="0 0 24 24" width="40" height="40"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3 0-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <strong data-i18n="chatSoonTitle">Chat</strong>
          <span data-i18n="chatSoonText">Muy pronto podrás chatear aquí.</span>
        </div>
      </section>
    </aside>

    <!-- Divisor: arrastrar para cambiar el ancho del panel; la pestaña lo expande a pantalla completa -->
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-attr="aria-label:resizePanel;title:resizePanel">
      <button class="expand-tab" id="expandTab" type="button" data-i18n-attr="aria-label:expandPanel;title:expandPanel">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- Zona principal: USFans incrustado -->
    <main class="main">
      <div class="bar">
        <button class="btn ghost" id="openDrawer" data-i18n-attr="aria-label:showProducts">
          <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.6"/></svg>
          <span data-i18n="products">Productos</span>
        </button>
        <div class="tabs" id="tabs" role="tablist" data-i18n-attr="aria-label:tabsLabel"></div>
        <button class="icon-btn" id="newTab" data-i18n-attr="title:newTab;aria-label:newTab">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="btn ghost" id="goHome" data-i18n="goHome" hidden>← Registro</button>
        <a class="btn" id="openTab" href="#" target="_blank" rel="noopener" data-i18n="openBrowser">Abrir en navegador</a>
      </div>
      <div class="frame-wrap" id="frames">
        <div class="frame-loading" id="frameLoading"><span class="spinner"></span></div>
      </div>
      <p class="hint" data-i18n-html="hint">Haz clic derecho en un producto para ver más opciones. Si algo no carga o no puedes pagar, usa <strong>Abrir en navegador</strong>.</p>
    </main>
  </div>
  <div class="menu" id="menu" role="menu" hidden></div>

  <!-- Móvil: lengüetas para deslizar entre USFans y el panel (los toques sobre USFans no llegan a la web) -->
  <div class="pull-tab pull-left" id="swipeEdge" role="button" tabindex="0" data-i18n-attr="aria-label:showProducts">
    <span class="pull-tab-grip"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>
  <div class="pull-tab pull-right" id="swipeBack" role="button" tabindex="0" data-i18n-attr="aria-label:coachCloseText">
    <span class="pull-tab-grip"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>

  <!-- Móvil: guía de gestos la primera vez, señalando la lengüeta que hay que deslizar -->
  <div class="coach" id="coach" hidden>
    <div class="coach-hint" id="coachHint">
      <p class="coach-title" id="coachTitle"></p>
      <p class="coach-text" id="coachText"></p>
    </div>
    <div class="coach-gesture" aria-hidden="true"><span class="coach-trail"></span><svg class="coach-hand" viewBox="0 0 24 24" width="46" height="46"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-.5V4a1.5 1.5 0 0 1 3 0v6m0-.5V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.8a6 6 0 0 1-4.6-2.2L3.4 15.1a1.6 1.6 0 0 1 2.4-2.1L9 15" fill="#fff" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <button class="coach-skip" id="coachSkip" type="button" data-i18n="coachSkip">Saltar</button>
  </div>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
    <button class="lb-btn lb-close" id="lbClose" data-i18n-attr="aria-label:close">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="lb-btn lb-prev" id="lbPrev" data-i18n-attr="aria-label:prevPhoto">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img class="lb-img" id="lbImg" alt="">
    <button class="lb-btn lb-next" id="lbNext" data-i18n-attr="aria-label:nextPhoto">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="lb-count" id="lbCount"></p>
  </div>
</body>
</html>
